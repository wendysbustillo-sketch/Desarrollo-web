<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
    <title>Registro en nuestra tienda</title>
    <!-- Punto 1: Enlace a css/estilos.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<h1>Registro en nuestra tienda</h1>

    <form action="#" method="post">
        <!-- Nombre de usuario -->
        <div>
            <label for="usuario">Nombre de usuario</label><br>
            <input type="text" id="usuario" name="usuario" placeholder="Ej: luis">
        </div>
        <br>

        <!-- Email -->
        <div>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="Ej: luis@gmail.com">
        </div>
        <br>

        <!-- Edad -->
        <div>
            <label for="edad" style="color: red;">Edad:</label><br>
            <input type="number" id="edad" name="edad" placeholder="Ej: 21">
        </div>
        <br>

        <!-- Fecha de nacimiento -->
        <div>
            <label for="fecha">Fecha de nacimiento:</label><br>
            <input type="text" id="fecha" name="fecha" placeholder="dd/mm/aaaa">
        </div>
        <br>

        <!-- Género -->
        <div>
            <label>Género:</label><br>
            <input type="radio" name="genero" value="m"> Masculino<br>
            <input type="radio" name="genero" value="f"> Femenino
        </div>
        <br>

        <!-- Recomendado por -->
        <div>
            <label for="recomendado">Recomendado por:</label><br>
            <select id="recomendado" name="recomendado">
                <option value="google">Google</option>
                <option value="amigo">Amigo</option>
            </select>
        </div>
        <br>

        <!-- Comentarios  -->
        <div>
            <label for="comentarios">Comentarios:</label><br>
            <textarea id="comentarios" name="comentarios"></textarea>
        </div>
        <br>

        <!-- Acepto términos -->
        <div>
            <label for="terminos">Acepto terminos y condiciones:</label><br>
            <input type="checkbox" id="terminos" name="terminos">
        </div>
        <br>

        <!-- Botón -->
        <button type="submit">Registrar</button>
    </form>


</body>
</html>
